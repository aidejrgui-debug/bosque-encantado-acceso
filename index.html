<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>
    Halloween: Bosque Encantado - Control de acceso
  </title>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background: #080d0a;

      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      padding:
        max(28px, env(safe-area-inset-top))
        18px
        max(30px, env(safe-area-inset-bottom));
    }


    .app {

      width: 100%;

      max-width: 720px;

      margin: 0 auto;
    }


    /* =========================
       ENCABEZADO
    ========================= */

    .header {

      text-align: center;

      margin-bottom: 30px;
    }


    .header h1 {

      margin: 0;

      font-size:
        clamp(32px, 8vw, 52px);

      line-height: 1.02;

      font-weight: 900;

      letter-spacing: -1px;
    }


    .header .linea1 {

      display: block;

      font-size: 0.67em;

      margin-bottom: 6px;
    }


    .header .linea2 {

      display: block;
    }


    .subtitulo {

      margin-top: 18px;

      color: #aeb7b0;

      font-size:
        clamp(20px, 5vw, 28px);

      font-weight: 700;
    }


    /* =========================
       PANEL
    ========================= */

    .panel {

      background: #111712;

      border-radius: 30px;

      padding: 26px;

      box-shadow:
        0 20px 70px
        rgba(0, 0, 0, 0.25);
    }


    /* =========================
       BOTONES
    ========================= */

    button {

      width: 100%;

      border: 0;

      border-radius: 22px;

      padding: 23px 16px;

      font-size:
        clamp(19px, 5vw, 28px);

      font-weight: 900;

      cursor: pointer;
    }


    button:active {

      transform: scale(0.985);
    }


    button:disabled {

      opacity: 0.55;

      cursor: default;
    }


    .btn-principal {

      background: white;

      color: #111;
    }


    .btn-secundario {

      background: #2b312d;

      color: white;
    }


    .btn-siguiente {

      background: white;

      color: #111;

      margin-top: 24px;
    }


    .espacio {

      height: 18px;
    }


    /* =========================
       LOGIN
    ========================= */

    #loginScreen {

      display: none;
    }


    .pin-label {

      display: block;

      margin-bottom: 12px;

      text-align: center;

      font-size: 18px;

      font-weight: 800;

      color: #d9dfda;
    }


    #pinInput {

      width: 100%;

      padding: 20px;

      margin-bottom: 18px;

      border: 2px solid #303832;

      border-radius: 18px;

      background: #080d0a;

      color: white;

      text-align: center;

      font-size: 27px;

      font-weight: 800;

      letter-spacing: 5px;

      outline: none;
    }


    #pinInput:focus {

      border-color: white;
    }


    #mensajePin {

      display: none;

      margin-top: 16px;

      text-align: center;

      font-size: 17px;

      font-weight: 800;

      color: #ff6961;
    }


    /* =========================
       SCANNER
    ========================= */

    #scannerScreen {

      display: none;
    }


    .scanner-box {

      position: relative;

      width: 100%;

      overflow: hidden;

      border-radius: 24px;

      background: #000;
    }


    #reader {

      width: 100%;

      min-height: 320px;

      background: #000;
    }


    #reader video {

      object-fit: cover !important;

      border-radius: 24px;
    }


    #reader__dashboard_section_swaplink,
    #reader__dashboard_section_csr,
    #reader__status_span {

      display: none !important;
    }


    .scanner-overlay {

      pointer-events: none;

      position: absolute;

      inset: 0;

      display: flex;

      justify-content: center;

      align-items: center;

      z-index: 5;
    }


    .scanner-frame {

      width: 78%;

      aspect-ratio: 1 / 1;

      position: relative;
    }


    .corner {

      position: absolute;

      width: 72px;

      height: 72px;

      border-color: #6cff43;

      border-style: solid;
    }


    .c1 {

      top: 0;

      left: 0;

      border-width: 8px 0 0 8px;
    }


    .c2 {

      top: 0;

      right: 0;

      border-width: 8px 8px 0 0;
    }


    .c3 {

      bottom: 0;

      left: 0;

      border-width: 0 0 8px 8px;
    }


    .c4 {

      bottom: 0;

      right: 0;

      border-width: 0 8px 8px 0;
    }


    .scanner-status {

      position: absolute;

      top: 10px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 7;

      padding: 6px 15px;

      border-radius: 100px;

      background:
        rgba(0, 0, 0, 0.55);

      color: white;

      font-size: 16px;

      font-weight: 700;

      backdrop-filter: blur(8px);
    }


    /* =========================
       RESULTADOS
    ========================= */

    #resultado {

      display: none;

      margin-top: 24px;

      border-radius: 27px;

      padding: 30px 24px;

      text-align: center;
    }


    #resultado.valido {

      background: #147d35;
    }


    #resultado.error {

      background: #ad231d;
    }


    #resultado.advertencia {

      background: #a75c08;
    }


    #resultado h2 {

      margin: 0;

      font-size:
        clamp(28px, 7vw, 42px);

      line-height: 1.08;

      font-weight: 950;
    }


    #resultado .folio {

      margin-top: 28px;

      font-size:
        clamp(27px, 7vw, 40px);

      font-weight: 950;
    }


    #resultado .detalle {

      margin-top: 19px;

      font-size:
        clamp(17px, 4.5vw, 22px);

      line-height: 1.4;

      font-weight: 700;
    }


    /* =========================
       AYUDA
    ========================= */

    .ayuda {

      margin: 22px 10px 2px;

      text-align: center;

      color: #acb4ae;

      font-size: 17px;

      line-height: 1.4;

      font-weight: 650;
    }


    .oculto {

      display: none !important;
    }


    #fileInput {

      display: none;
    }


    @media (max-width: 520px) {

      body {

        padding-left: 14px;

        padding-right: 14px;
      }


      .panel {

        padding: 20px;

        border-radius: 26px;
      }


      .corner {

        width: 55px;

        height: 55px;
      }
    }

  </style>

</head>



<body>

<main class="app">


  <!-- =========================
       TÍTULO
  ========================== -->

  <header class="header">

    <h1>

      <span class="linea1">
        Halloween:
      </span>

      <span class="linea2">
        Bosque Encantado<br>
        🎃🧝🏼‍♂️🦄
      </span>

    </h1>


    <div class="subtitulo">
      Control de acceso
    </div>

  </header>



  <!-- =========================
       PIN
  ========================== -->

  <section
    id="loginScreen"
    class="panel"
  >

    <label
      for="pinInput"
      class="pin-label"
    >
      PIN DEL PERSONAL
    </label>


    <input
      id="pinInput"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="••••••••"
    >


    <button
      id="btnEntrar"
      class="btn-principal"
    >
      ENTRAR
    </button>


    <div id="mensajePin">
      PIN incorrecto
    </div>


    <p class="ayuda">
      Ingresa el PIN autorizado
      para el personal de acceso.
    </p>

  </section>



  <!-- =========================
       SCANNER
  ========================== -->

  <section
    id="scannerScreen"
    class="panel"
  >


    <button
      id="btnCamara"
      class="btn-principal"
    >
      📷 ACTIVAR CÁMARA
    </button>


    <div
      id="scannerContainer"
      class="scanner-box oculto"
    >

      <div id="reader"></div>


      <div
        id="scannerStatus"
        class="scanner-status"
      >
        Scanner activo
      </div>


      <div class="scanner-overlay">

        <div class="scanner-frame">

          <div class="corner c1"></div>

          <div class="corner c2"></div>

          <div class="corner c3"></div>

          <div class="corner c4"></div>

        </div>

      </div>

    </div>



    <!-- RESULTADO -->

    <div id="resultado">

      <h2 id="resultadoTitulo"></h2>

      <div
        id="resultadoFolio"
        class="folio"
      ></div>

      <div
        id="resultadoDetalle"
        class="detalle"
      ></div>

    </div>



    <button
      id="btnSiguiente"
      class="btn-siguiente oculto"
    >
      ESCANEAR SIGUIENTE
    </button>


    <div class="espacio"></div>


    <button
      id="btnFoto"
      class="btn-secundario"
    >
      🖼️ LEER QR DESDE FOTO
    </button>


    <input
      id="fileInput"
      type="file"
      accept="image/*"
    >


    <p class="ayuda">
      Si el navegador pide permiso
      para usar la cámara,
      selecciona
      <strong>Permitir</strong>.
    </p>

  </section>

</main>



<script>

  /* ==========================================
     BACKEND DE PRODUCCIÓN
  ========================================== */

  const API_URL =
    "https://script.google.com/macros/s/AKfycby3pVxZWxR1RdoAucq5f0urDr6r1G-MewtEC0vK-8U6Gy-BuR1Q1C5IfDUpbxTVc9uC/exec";


  const PIN_KEY =
    "bosque_encantado_staff_pin_2026";



  /* ==========================================
     ELEMENTOS
  ========================================== */

  const loginScreen =
    document.getElementById(
      "loginScreen"
    );


  const scannerScreen =
    document.getElementById(
      "scannerScreen"
    );


  const pinInput =
    document.getElementById(
      "pinInput"
    );


  const btnEntrar =
    document.getElementById(
      "btnEntrar"
    );


  const mensajePin =
    document.getElementById(
      "mensajePin"
    );


  const btnCamara =
    document.getElementById(
      "btnCamara"
    );


  const btnFoto =
    document.getElementById(
      "btnFoto"
    );


  const fileInput =
    document.getElementById(
      "fileInput"
    );


  const btnSiguiente =
    document.getElementById(
      "btnSiguiente"
    );


  const scannerContainer =
    document.getElementById(
      "scannerContainer"
    );


  const scannerStatus =
    document.getElementById(
      "scannerStatus"
    );


  const resultado =
    document.getElementById(
      "resultado"
    );


  const resultadoTitulo =
    document.getElementById(
      "resultadoTitulo"
    );


  const resultadoFolio =
    document.getElementById(
      "resultadoFolio"
    );


  const resultadoDetalle =
    document.getElementById(
      "resultadoDetalle"
    );



  /* ==========================================
     VARIABLES
  ========================================== */

  let qrScanner = null;

  let camaraActiva = false;

  let scannerPausado = false;

  let procesando = false;

  let reiniciarCamaraDespuesDeFoto =
    false;



  /* ==========================================
     INICIAR
  ========================================== */

  iniciar();


  async function iniciar() {

    const pinGuardado =
      localStorage.getItem(
        PIN_KEY
      );


    if (!pinGuardado) {

      mostrarLogin();

      return;
    }


    const valido =
      await comprobarPin(
        pinGuardado
      );


    if (valido) {

      mostrarScanner();

    } else {

      localStorage.removeItem(
        PIN_KEY
      );

      mostrarLogin();
    }
  }



  /* ==========================================
     LOGIN
  ========================================== */

  function mostrarLogin() {

    loginScreen.style.display =
      "block";

    scannerScreen.style.display =
      "none";


    mensajePin.style.display =
      "none";


    setTimeout(
      () => pinInput.focus(),
      200
    );
  }


  function mostrarScanner() {

    loginScreen.style.display =
      "none";

    scannerScreen.style.display =
      "block";
  }



  btnEntrar.addEventListener(
    "click",
    guardarPin
  );


  pinInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        guardarPin();
      }
    }
  );



  async function guardarPin() {

    const pin =
      pinInput.value.trim();


    mensajePin.style.display =
      "none";


    if (!pin) {

      mensajePin.textContent =
        "Ingresa el PIN.";

      mensajePin.style.display =
        "block";

      return;
    }


    btnEntrar.disabled = true;

    btnEntrar.textContent =
      "VERIFICANDO...";


    const valido =
      await comprobarPin(pin);


    if (valido) {

      localStorage.setItem(
        PIN_KEY,
        pin
      );


      pinInput.value = "";


      mostrarScanner();

    } else {

      localStorage.removeItem(
        PIN_KEY
      );


      pinInput.value = "";


      mensajePin.textContent =
        "PIN incorrecto";


      mensajePin.style.display =
        "block";


      pinInput.focus();
    }


    btnEntrar.disabled = false;

    btnEntrar.textContent =
      "ENTRAR";
  }



  async function comprobarPin(pin) {

    try {

      const respuesta =
        await fetch(
          API_URL,
          {
            method: "POST",

            redirect: "follow",

            cache: "no-store",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({
              accion: "validar_pin",
              pin: pin
            })
          }
        );


      const texto =
        await respuesta.text();


      const datos =
        JSON.parse(texto);


      return (
        datos.ok === true &&
        datos.estado ===
          "PIN_VALIDO"
      );


    } catch (error) {

      console.error(error);

      return false;
    }
  }



  /* ==========================================
     ACTIVAR CÁMARA
  ========================================== */

  btnCamara.addEventListener(
    "click",
    activarCamara
  );


  async function activarCamara() {

    btnCamara.disabled = true;


    try {

      scannerContainer
        .classList
        .remove("oculto");


      if (!qrScanner) {

        qrScanner =
          new Html5Qrcode(
            "reader",
            {
              formatsToSupport: [
                Html5QrcodeSupportedFormats
                  .QR_CODE
              ],

              verbose: false
            }
          );
      }


      try {

        await qrScanner.start(

          {
            facingMode: {
              exact:
                "environment"
            }
          },

          configuracionCamara(),

          onScanSuccess,

          () => {}
        );

      } catch (error) {

        /*
          Fallback para dispositivos
          que no aceptan exact: environment.
        */

        await qrScanner.start(

          {
            facingMode:
              "environment"
          },

          configuracionCamara(),

          onScanSuccess,

          () => {}
        );
      }


      camaraActiva = true;

      scannerPausado = false;


      scannerStatus.textContent =
        "Scanner activo";


      btnCamara
        .classList
        .add("oculto");


    } catch (error) {

      console.error(error);


      scannerContainer
        .classList
        .add("oculto");


      btnCamara.disabled = false;


      alert(
        "No fue posible activar la cámara. " +
        "Revisa los permisos del navegador."
      );
    }
  }



  function configuracionCamara() {

    return {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const minEdge =
          Math.min(
            width,
            height
          );


        const size =
          Math.floor(
            minEdge * 0.68
          );


        return {
          width: size,
          height: size
        };
      },

      aspectRatio: 1.0
    };
  }



  async function detenerCamara() {

    if (
      qrScanner &&
      camaraActiva
    ) {

      try {

        await qrScanner.stop();

      } catch (error) {

        console.log(error);
      }
    }


    camaraActiva = false;

    scannerPausado = false;


    btnCamara.disabled = false;


    btnCamara
      .classList
      .remove("oculto");


    scannerContainer
      .classList
      .add("oculto");
  }



  /* ==========================================
     QR DETECTADO
  ========================================== */

  async function onScanSuccess(
    decodedText
  ) {

    if (procesando) return;


    procesando = true;


    if (
      qrScanner &&
      camaraActiva &&
      !scannerPausado
    ) {

      try {

        qrScanner.pause(false);


        scannerPausado = true;


        scannerStatus.textContent =
          "Scanner pausado";

      } catch (error) {

        console.log(error);
      }
    }


    await validarCodigo(
      decodedText
    );


    procesando = false;
  }



  /* ==========================================
     VALIDAR BOLETO
  ========================================== */

  async function validarCodigo(
    codigo
  ) {

    limpiarResultado();


    const pin =
      localStorage.getItem(
        PIN_KEY
      ) || "";


    try {

      const respuesta =
        await fetch(
          API_URL,
          {
            method: "POST",

            redirect: "follow",

            cache: "no-store",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({
              pin: pin,
              codigo: codigo
            })
          }
        );


      const texto =
        await respuesta.text();


      const datos =
        JSON.parse(texto);


      /*
        Si el PIN guardado dejó de ser válido,
        borramos la sesión inmediatamente.
      */

      if (
        datos.estado ===
        "PIN_INCORRECTO"
      ) {

        localStorage.removeItem(
          PIN_KEY
        );


        await detenerCamara();


        alert(
          "El PIN de acceso ya no es válido."
        );


        mostrarLogin();

        return;
      }


      mostrarResultado(datos);


    } catch (error) {

      console.error(error);


      mostrarResultado({
        ok: false,

        estado: "ERROR",

        mensaje:
          "No se pudo conectar con el servidor."
      });
    }
  }



  /* ==========================================
     MOSTRAR RESULTADO
  ========================================== */

  function mostrarResultado(
    datos
  ) {

    resultado.style.display =
      "block";


    resultado.className = "";


    btnSiguiente
      .classList
      .remove("oculto");


    const estado =
      datos.estado || "";



    /* ACCESO VÁLIDO */

    if (
      datos.ok === true &&
      estado === "VALIDO"
    ) {

      resultado.classList.add(
        "valido"
      );


      resultadoTitulo.textContent =
        "✅ ACCESO VÁLIDO";


      resultadoFolio.textContent =
        datos.folio || "";


      resultadoDetalle.textContent =
        datos.hora_entrada
          ? formatearFecha(
              datos.hora_entrada
            )
          : "";


      return;
    }



    /* YA UTILIZADO */

    if (estado === "USADO") {

      resultado.classList.add(
        "error"
      );


      resultadoTitulo.textContent =
        "⛔ BOLETO YA UTILIZADO";


      resultadoFolio.textContent =
        datos.folio || "";


      resultadoDetalle.textContent =
        datos.hora_entrada

          ? "Entrada registrada: " +
            formatearFecha(
              datos.hora_entrada
            )

          : "";


      return;
    }



    /* NO ACTIVADO */

    if (
      estado === "NO_ACTIVADO"
    ) {

      resultado.classList.add(
        "advertencia"
      );


      resultadoTitulo.textContent =
        "⚠️ BOLETO NO ACTIVADO";


      resultadoFolio.textContent =
        datos.folio || "";


      resultadoDetalle.textContent =
        "Este boleto todavía no está registrado como vendido.";


      return;
    }



    /* CANCELADO */

    if (
      estado === "CANCELADO"
    ) {

      resultado.classList.add(
        "error"
      );


      resultadoTitulo.textContent =
        "🚫 BOLETO CANCELADO";


      resultadoFolio.textContent =
        datos.folio || "";


      resultadoDetalle.textContent =
        "Este boleto no tiene acceso al evento.";


      return;
    }



    /* CÓDIGO FALSO */

    if (
      estado === "NO_EXISTE"
    ) {

      resultado.classList.add(
        "error"
      );


      resultadoTitulo.textContent =
        "❌ CÓDIGO NO RECONOCIDO";


      resultadoFolio.textContent =
        "";


      resultadoDetalle.textContent =
        "El QR no pertenece a los boletos oficiales.";


      return;
    }



    /* OTRO ERROR */

    resultado.classList.add(
      "error"
    );


    resultadoTitulo.textContent =
      "⚠️ ERROR";


    resultadoFolio.textContent =
      datos.folio || "";


    resultadoDetalle.textContent =
      datos.mensaje ||
      "No fue posible validar el boleto.";
  }



  /* ==========================================
     ESCANEAR SIGUIENTE
  ========================================== */

  btnSiguiente.addEventListener(
    "click",
    async () => {

      limpiarResultado();


      if (
        qrScanner &&
        camaraActiva &&
        scannerPausado
      ) {

        try {

          qrScanner.resume();


          scannerPausado = false;


          scannerStatus.textContent =
            "Scanner activo";


        } catch (error) {

          console.error(error);
        }
      }


      else if (
        reiniciarCamaraDespuesDeFoto
      ) {

        reiniciarCamaraDespuesDeFoto =
          false;


        await activarCamara();
      }
    }
  );



  function limpiarResultado() {

    resultado.style.display =
      "none";


    resultado.className = "";


    resultadoTitulo.textContent =
      "";


    resultadoFolio.textContent =
      "";


    resultadoDetalle.textContent =
      "";


    btnSiguiente
      .classList
      .add("oculto");
  }



  /* ==========================================
     LEER QR DESDE FOTO
  ========================================== */

  btnFoto.addEventListener(
    "click",
    () => {

      fileInput.value = "";

      fileInput.click();
    }
  );



  fileInput.addEventListener(
    "change",
    async event => {

      const archivo =
        event.target.files[0];


      if (!archivo) return;


      limpiarResultado();


      try {

        if (camaraActiva) {

          reiniciarCamaraDespuesDeFoto =
            true;


          await qrScanner.stop();


          camaraActiva = false;

          scannerPausado = false;


          scannerContainer
            .classList
            .add("oculto");
        }


        if (!qrScanner) {

          qrScanner =
            new Html5Qrcode(
              "reader",
              {
                formatsToSupport: [
                  Html5QrcodeSupportedFormats
                    .QR_CODE
                ]
              }
            );
        }


        const codigo =
          await qrScanner.scanFile(
            archivo,
            true
          );


        procesando = true;


        await validarCodigo(
          codigo
        );


        procesando = false;


      } catch (error) {

        console.error(error);


        procesando = false;


        mostrarResultado({
          ok: false,

          estado: "ERROR",

          mensaje:
            "No pude encontrar un código QR válido en esa imagen."
        });
      }
    }
  );



  /* ==========================================
     FECHA
  ========================================== */

  function formatearFecha(
    valor
  ) {

    if (!valor) return "";


    try {

      const fecha =
        new Date(valor);


      return fecha.toLocaleString(
        "es-MX",
        {
          day: "2-digit",

          month: "2-digit",

          year: "numeric",

          hour: "2-digit",

          minute: "2-digit",

          second: "2-digit"
        }
      );


    } catch (error) {

      return valor;
    }
  }

</script>
